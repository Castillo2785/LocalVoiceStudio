name: Bug report
description: Report a reproducible problem in VoiceStudio.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove private scripts, generated audio, API keys, or other sensitive information before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observable problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Generate ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, Node, Python, FFmpeg, browser, and the selected voice/language.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs only. Never include tokens or personal text that should remain private.
